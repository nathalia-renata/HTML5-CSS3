<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/geral.css" type="text/css">
    <title>Formulário de Cadastro</title>
  </head>
<body>
    <div class="tabela">
    <h1>Cadastro de Devedores</h1>
    <form>
        <label>NOME</label>
        <input type="text" maxlength="4" required>
        <label>SENHA</label>
        <input type="password">
        <br>
        <br>
        <label>Data de Nascimento</label>
        <input type="date">
        <label>Valor da Dívida</label>
        <input type="number" step="0.01">
        <br>
        <br>
        <label>Cidade</label>
        <select>
            <option>Betim</option>
            <option>Contagem</option>
            <option>Vespasiano</option>
            <option>Belo Horizonte</option>
        </select>
        <label>Sexo</label>
        <input type="radio" name="sexo"><label>Masculino</label>
        <input type="radio" name="sexo"></label>Feminino</label>
        <br>
        <br>
        <label>Habilidades</label>
        <br>
        <input type="checkbox"><label>Luta</label>
        <input type="checkbox"><label>Corrida</label>
        <input type="checkbox"><label>Xadrez</label>
        <br>
        <br>
        <input type="submit" value="Entrar">
        
    </form>
    </div>
</body>
</html>
