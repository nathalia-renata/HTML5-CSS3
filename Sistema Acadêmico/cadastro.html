<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/geral.css" type="text/css">
    <title>Cadastro de Clientes</title>
</head>
<body>
    <div class="tabela">
    <label>LOGIN</label>
    <br>
    <input type="text">
    <br>
    <label>SENHA</label>
    <br>
    <input type="password">
    <br>
    <input type="submit" value="ENTRAR">
    <input type="submit" value="LIMPAR">
        <br>
        <br>
        <br>
        <label>CADASTRO DE CLIENTES</label>
        <br>
        <br>
        <label>NOME</label>
        <input type="text">
        <br>
        <label>DATA DE NASCIMENTO</label>
        <input type="date">
        <br>
        <label>SEXO</label>
        <input type="radio" name="sexo"><label>M</label>
        <input type="radio" name="sexo"><label>F</label>
        <input type="radio" name="sexo"><label>OUTRO</label>
        <br>
        <label>ESTADO</label>
        <select>
            <option>Minas Gerais</option>
            <option>São Paulo</option>
            <option>Fortaleza</option>
            <option>Góias</option>
        </select>
        <br>
        <br>
        <label>PREFERÊNCIA:</label>
        <br>
        <input type="checkbox"><label>Filme</label>
        <input type="checkbox"><label>Música</label>
        <br>
        <input type="checkbox"><label>Games</label>
        <input type="checkbox"><label>Esporte</label>
        <br>
        <br>
        <input type="submit" value="CONFIRMAR">
    </div>
</body>
</html>
